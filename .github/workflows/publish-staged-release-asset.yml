name: Publish staged release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string
      staging_ref:
        description: Temporary branch containing release-staging files
        required: true
        default: release-upload-staging
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      STAGING_REF: ${{ inputs.staging_ref }}
      ASSET_PATH: release-staging/GameArchiveManager-0.1.0-RC2.zip
      HASH_PATH: release-staging/GameArchiveManager-0.1.0-RC2.sha256
    steps:
      - name: Check out staged assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_REF }}

      - name: Verify staged ZIP checksum
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk 'NR == 1 { print $1 }' "$HASH_PATH")"
          actual="$(sha256sum "$ASSET_PATH" | awk '{ print toupper($1) }')"
          test "$actual" = "$expected"

      - name: Upload assets to the draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$ASSET_PATH#Windows x64 onedir build" \
            "$HASH_PATH#SHA-256 checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
