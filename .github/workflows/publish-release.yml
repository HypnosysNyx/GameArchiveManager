name: Build and upload Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_NAME: GameArchiveManager-0.1.0-RC2
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run automated tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build Windows onedir package
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean GameArchiveManager.spec
          $releaseDir = Join-Path "dist" $env:RELEASE_NAME
          $sourceCommit = git rev-parse HEAD
          Copy-Item README.md,LICENSE -Destination $releaseDir
          Copy-Item docs\SECURITY.md,docs\CONFIGURATION.md,docs\USER_GUIDE.md,docs\RELEASE_NOTES_0.1.0_RC2.md,docs\RC_BUILD_NOTES.md,docs\RC_SMOKE_TEST.md -Destination $releaseDir
          @"
          GameArchiveManager 0.1.0 RC2
          Source tag: $env:RELEASE_TAG
          Source commit: $sourceCommit
          Builder: GitHub Actions windows-latest, Python 3.12, PyInstaller 6.21.0
          Executable: unsigned Windows x64 onedir pre-release build
          "@ | Set-Content -LiteralPath (Join-Path $releaseDir "BUILD_INFO.txt") -Encoding utf8
          Compress-Archive -LiteralPath $releaseDir -DestinationPath "$env:RELEASE_NAME.zip" -CompressionLevel Optimal

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$env:RELEASE_NAME.zip").Hash
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\$env:RELEASE_NAME\GameArchiveManager.exe").Hash
          @(
            "$zipHash  $env:RELEASE_NAME.zip"
            "$exeHash  GameArchiveManager.exe"
          ) | Set-Content -LiteralPath "$env:RELEASE_NAME.sha256" -Encoding ascii

      - name: Upload assets to the draft release
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" `
            "$env:RELEASE_NAME.zip#Windows x64 onedir build" `
            "$env:RELEASE_NAME.sha256#SHA-256 checksums" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber
